name: ci

on:
  push:
    branches: [main]
  pull_request:

# 一条通用 workflow（docs/codex/research/03 §6：不按市场复制多条）。
# 无真实 secret：全部验证都可用 mock adapter 完成（04 §11）。

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      MARKET: au
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Documentation sync
        run: pnpm docs:check

      # harness 自身回归（post-edit stdin/stdout；谁来测测试者）
      - name: Harness evals (post-edit)
        run: pnpm test:harness-evals

      # warn-only：companions 默认 exit 0；升 COMPANIONS_LEVEL=error 前用全量盘点暴露债
      - name: Component companions (warn)
        run: pnpm quality:companions -- --report-all

      - name: Unit tests
        run: pnpm test

      - name: Production build (Turbopack + Cache Components)
        run: pnpm build

      - name: Runtime market smoke (standalone)
        run: pnpm smoke:runtime-market

  deploy:
    # main 推送且 quality 全绿后自动部署到 Cloudflare Workers；PR 只验证不部署。
    # 需要的 secret：CLOUDFLARE_API_TOKEN（CF Dashboard → My Profile → API Tokens →
    # "Edit Cloudflare Workers" 模板，作用域限本账号）。account_id 已固定在 wrangler.jsonc。
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-cf-main
      cancel-in-progress: false
    env:
      MARKET: au
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and deploy to Cloudflare Workers
        run: bash scripts/deploy-cf.sh
