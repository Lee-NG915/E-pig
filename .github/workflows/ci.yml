name: ci

on:
  push:
    branches: [main]
  pull_request:

# 一条通用 workflow（docs/codex/research/03 §6：不按市场复制多条）。
# 无真实 secret：全部验证都可用 mock adapter 完成（04 §11）。

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Production build (Turbopack + Cache Components)
        run: pnpm build
